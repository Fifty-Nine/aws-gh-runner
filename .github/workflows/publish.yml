name: "Publish to FlakeHub"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # Required for FlakeHub authentication
  contents: read

jobs:
  flakehub-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-push@v1
        with:
          rolling: true
          visibility: "public"